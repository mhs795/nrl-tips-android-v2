name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Cache project .buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-dot-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-dot-buildozer-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            gettext autopoint \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            uuid-dev \
            ccache

      - name: Install buildozer and cython
        run: pip install --upgrade buildozer "cython<3"

      - name: Run backend smoke tests
        run: |
          pip install numpy pandas requests charset-normalizer \
                      beautifulsoup4 openpyxl scikit-learn
          python test_backend.py

      - name: Set up Android SDK (cmdline-tools + build-tools + licenses)
        run: |
          ANDROID_HOME="${HOME}/.buildozer/android/platform/android-sdk"
          mkdir -p "${ANDROID_HOME}/cmdline-tools"

          # Download cmdline-tools only if not already present (cache-safe)
          if [ ! -f "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q -O /tmp/cmdlinetools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdlinetools.zip -d /tmp/cmdlinetools-extract/
            rm -rf "${ANDROID_HOME}/cmdline-tools/latest"
            mv /tmp/cmdlinetools-extract/cmdline-tools "${ANDROID_HOME}/cmdline-tools/latest"
          fi

          # Symlink sdkmanager to old tools/bin path that buildozer expects
          mkdir -p "${ANDROID_HOME}/tools/bin"
          ln -sf "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME}/tools/bin/sdkmanager"

          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          # Accept all licenses
          yes | "$SDKMGR" --sdk_root="${ANDROID_HOME}" --licenses 2>/dev/null || true

          # Install required SDK components
          "$SDKMGR" --sdk_root="${ANDROID_HOME}" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools"

      - name: Pre-download NDK r25b and create libuuid ARM64 stub
        run: |
          NDK_DIR="${HOME}/.buildozer/android/platform/android-ndk-r25b"
          if [ ! -d "$NDK_DIR" ]; then
            echo "Downloading NDK r25b (~800 MB)..."
            wget -q -O /tmp/ndk.zip \
              "https://dl.google.com/android/repository/android-ndk-r25b-linux.zip"
            mkdir -p "${HOME}/.buildozer/android/platform"
            unzip -q /tmp/ndk.zip -d "${HOME}/.buildozer/android/platform"
          fi

          CLANG="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          AR="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          LIBDIR="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android"

          cat > /tmp/uuid_stub.c << 'CEOF'
          #include <string.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <stdio.h>
          typedef unsigned char uuid_t[16];
          static void _u(uuid_t o){int f=open("/dev/urandom",0);if(f>=0){read(f,o,16);close(f);}else memset(o,0,16);}
          void uuid_generate(uuid_t o){_u(o);}
          void uuid_generate_random(uuid_t o){_u(o);}
          void uuid_generate_time(uuid_t o){_u(o);}
          int uuid_generate_time_safe(uuid_t o){_u(o);return 0;}
          void uuid_clear(uuid_t u){memset(u,0,16);}
          int uuid_compare(const uuid_t a,const uuid_t b){return memcmp(a,b,16);}
          void uuid_copy(uuid_t d,const uuid_t s){memcpy(d,s,16);}
          int uuid_is_null(const uuid_t u){int i;for(i=0;i<16;i++)if(u[i])return 0;return 1;}
          int uuid_parse(const char*i,uuid_t u){memset(u,0,16);return 0;}
          void uuid_unparse(const uuid_t u,char*o){const unsigned char*b=u;snprintf(o,37,"%02x%02x%02x%02x-%02x%02x-%02x%02x-%02x%02x-%02x%02x%02x%02x%02x%02x",b[0],b[1],b[2],b[3],b[4],b[5],b[6],b[7],b[8],b[9],b[10],b[11],b[12],b[13],b[14],b[15]);}
          CEOF

          "$CLANG" -target aarch64-linux-android21 -c /tmp/uuid_stub.c -o /tmp/uuid_stub.o
          "$AR" rcs "${LIBDIR}/libuuid.a" /tmp/uuid_stub.o
          echo "libuuid.a ARM64 stub created at ${LIBDIR}/libuuid.a"

      - name: Auto-increment version
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          sed -i "s/^version.numeric = .*/version.numeric = ${VERSION_CODE}/" buildozer.spec
          echo "Updated version.numeric to ${VERSION_CODE}"

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nrl-tips-debug-apk
          path: bin/*.apk
          retention-days: 30
